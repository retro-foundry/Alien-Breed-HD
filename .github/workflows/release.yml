name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.4; existing unless source_ref is supplied"
        required: true
        type: string
      source_ref:
        description: "Optional full commit SHA to build and validate before creating a new tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate release request
    if: github.repository == 'retro-foundry/Alien-Breed-HD'
    runs-on: ubuntu-latest
    steps:
      - name: Validate version and source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_SOURCE: ${{ inputs.source_ref }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_SOURCE" ]]; then
            if [[ ! "$RELEASE_SOURCE" =~ ^[0-9a-fA-F]{40}$ || "${RELEASE_SOURCE,,}" != "$WORKFLOW_COMMIT" ]]; then
              echo "source_ref must be the full commit SHA of the workflow ref, keeping provenance tied to the built source" >&2
              exit 1
            fi
          fi

  build-dos:
    name: Build DOS / 486 package
    needs: validate-release
    timeout-minutes: 45
    if: github.repository == 'retro-foundry/Alien-Breed-HD'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        shell: pwsh
        run: choco install ffmpeg ninja -y --no-progress

      - name: Set up DOS toolchain and SDL3
        shell: pwsh
        run: ./tools/setup_dos.ps1

      - name: Set up pinned DOSBox Staging
        id: dosbox
        shell: pwsh
        run: |
          $dosbox = ./tools/setup_dosbox.ps1
          "executable=$dosbox" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build and validate optimized DOS package
        shell: pwsh
        run: ./tools/build_dos.ps1 -ProfileGuided -DosBox '${{ steps.dosbox.outputs.executable }}'

      - name: Preserve failed DOS validation logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dos-validation-failure
          path: |
            build/dos/pgo/logs/**
            build/dos/pgo/checks/**/*.log
            build/dos/pgo/checks/**/BOOT.LOG
            build/dos/pgo/checks/**/host.err
            build/dos/pgo/checks/**/PASS.TXT
          if-no-files-found: ignore

      - name: Validate DOS archive
        run: python -m zipfile -t build/dos/ABHD-DOS.zip

      - name: Attest DOS package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "build/dos/ABHD-DOS.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dos
          path: build/dos/ABHD-DOS.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows package
    needs: validate-release
    if: github.repository == 'retro-foundry/Alien-Breed-HD'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "AB3D_RELEASE_VERSION=${{ inputs.tag }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "AB3D_RELEASE_VERSION=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:AB3D_RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Release version must be a tag like v1.0.0 or v1.0.0-beta.1; got $env:AB3D_RELEASE_VERSION"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install audio conversion dependency
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Optionally sign Windows executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            Write-Host "Windows signing secrets are not configured; skipping code signing."
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP "ab3d1-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found on the runner"
          }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD "build\Release\ab3d1.exe"

      - name: Package Windows release
        shell: pwsh
        run: python tools/package_release.py --build-dir build --config Release --version "$env:AB3D_RELEASE_VERSION" --output-dir dist

      - name: Attest Windows package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x64 package
    needs: validate-release
    if: github.repository == 'retro-foundry/Alien-Breed-HD'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set and validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "AB3D_RELEASE_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config ffmpeg \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libgl1-mesa-dev libudev-dev

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Package Linux release
        run: python tools/package_release.py --platform linux-x64 --build-dir build/linux-release --version "$AB3D_RELEASE_VERSION" --output-dir dist

      - name: Attest Linux package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*.tar.gz"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-windows, build-linux, build-dos]
    if: github.repository == 'retro-foundry/Alien-Breed-HD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          echo "AB3D_RELEASE_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$AB3D_RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release version must be a tag like v1.0.0 or v1.0.0-beta.1; got $AB3D_RELEASE_VERSION" >&2
            exit 1
          fi

          if [[ "$AB3D_RELEASE_VERSION" == *-* ]]; then
            echo "AB3D_RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "AB3D_RELEASE_MAKE_LATEST=false" >> "$GITHUB_ENV"
          else
            echo "AB3D_RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "AB3D_RELEASE_MAKE_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Create or verify release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          if [[ -n "$RELEASE_SOURCE" && ! "$RELEASE_SOURCE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be a full commit SHA" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_SOURCE" && "${RELEASE_SOURCE,,}" != "$commit" ]]; then
            echo "Checked-out source differs from the requested release commit" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$AB3D_RELEASE_VERSION"; then
            tagged=$(git rev-parse "$AB3D_RELEASE_VERSION^{commit}")
            if [[ "$tagged" != "$commit" ]]; then
              echo "Existing release tag points to another commit; refusing to move it" >&2
              exit 1
            fi
          else
            tag_object=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f "tag=$AB3D_RELEASE_VERSION" \
              -f "message=Alien Breed 3D I $AB3D_RELEASE_VERSION" \
              -f "object=$commit" -f type=commit --jq .sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$AB3D_RELEASE_VERSION" -f "sha=$tag_object"
          fi

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: python3 tools/sha256sums.py release-assets/*.zip release-assets/*.tar.gz --output release-assets/SHA256SUMS.txt

      - name: Attest checksum provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release-assets/SHA256SUMS.txt"

      - name: Prepare release notes
        shell: bash
        run: |
          notes="docs/releases/$AB3D_RELEASE_VERSION.md"
          if [[ -f "$notes" ]]; then
            cat "$notes" > release-notes.md
            printf '\n\n' >> release-notes.md
          fi
          cat VERIFY_RELEASE.md >> release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.AB3D_RELEASE_VERSION }}
          name: Alien Breed 3D I ${{ env.AB3D_RELEASE_VERSION }}
          prerelease: ${{ env.AB3D_RELEASE_PRERELEASE }}
          make_latest: ${{ env.AB3D_RELEASE_MAKE_LATEST }}
          body_path: release-notes.md
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
