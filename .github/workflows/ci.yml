name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dos:
    name: DOS / 486 build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        shell: pwsh
        run: choco install ffmpeg ninja -y --no-progress

      - name: Set up DOS toolchain and SDL3
        shell: pwsh
        run: ./tools/setup_dos.ps1

      - name: Build DOS package
        shell: pwsh
        run: ./tools/build_dos.ps1

      - name: Validate DOS archive
        run: python -m zipfile -t build/dos/ABHD-DOS.zip

      - name: Upload DOS package
        uses: actions/upload-artifact@v4
        with:
          name: dos-486
          path: build/dos/ABHD-DOS.zip
          if-no-files-found: error

  linux:
    name: Linux x64 build
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config ffmpeg \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libgl1-mesa-dev libudev-dev

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Validate runtime and package
        run: |
          test -x build/linux-release/ab3d1
          python tools/package_release.py --platform linux-x64 --build-dir build/linux-release --version ci --output-dir dist

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install audio conversion dependency
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Validate expected runtime output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @(
            "build/Release/ab3d1.exe",
            "build/Release/ab3d.ini",
            "build/Release/README.txt",
            "build/Release/data"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing expected build output: $path"
            }
          }
