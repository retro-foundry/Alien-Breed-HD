name: Level editor

on:
  push:
    branches: [main]
    paths:
      - 'editor/**'
      - 'tools/editor_oracles.py'
      - 'tools/editor_wall_oracles.py'
      - 'tools/editor_png_fixtures.py'
      - 'tools/build_editor_runtime.py'
      - 'tests/feedback_points.c'
      - 'tests/feedback_animation_limits.c'
      - 'tests/feedback_switch_slots.c'
      - 'tests/feedback_graphic_pick.c'
      - 'tests/feedback_animation_rooms.c'
      - 'tests/feedback_draw_rooms.c'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'amiga/data/levels/**'
      - 'amiga/data/includes/walls/**'
      - '.github/workflows/editor.yml'
  pull_request:
    paths:
      - 'editor/**'
      - 'tools/editor_oracles.py'
      - 'tools/editor_wall_oracles.py'
      - 'tools/editor_png_fixtures.py'
      - 'tools/build_editor_runtime.py'
      - 'tests/feedback_points.c'
      - 'tests/feedback_animation_limits.c'
      - 'tests/feedback_switch_slots.c'
      - 'tests/feedback_graphic_pick.c'
      - 'tests/feedback_animation_rooms.c'
      - 'tests/feedback_draw_rooms.c'
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'amiga/data/levels/**'
      - 'amiga/data/includes/walls/**'
      - '.github/workflows/editor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: Game engine preview / WebAssembly
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ffmpeg
      - name: Build the actual game engine for the editor
        shell: bash
        run: |
          git clone --depth 1 --branch 5.0.0 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/editor-emsdk"
          cd "$RUNNER_TEMP/editor-emsdk"
          ./emsdk install 5.0.0
          ./emsdk activate 5.0.0
          source ./emsdk_env.sh
          cd "$GITHUB_WORKSPACE"
          emcmake cmake --preset emscripten-release -G Ninja
          python tools/build_editor_runtime.py
          emcc tests/feedback_points.c src/level.c src/logging.c -Isrc -sUSE_SDL=2 -sENVIRONMENT=node -o "$RUNNER_TEMP/editor-point-test.js"
          node "$RUNNER_TEMP/editor-point-test.js"
          emcc tests/feedback_animation_limits.c src/objects.c src/logging.c -Isrc -sUSE_SDL=2 -sENVIRONMENT=node -O2 -o "$RUNNER_TEMP/editor-animation-test.js"
          node "$RUNNER_TEMP/editor-animation-test.js"
          emcc tests/feedback_switch_slots.c src/objects.c -Isrc -sUSE_SDL=2 -sENVIRONMENT=node -O2 -sSAFE_HEAP=1 -o "$RUNNER_TEMP/editor-switch-test.js"
          node "$RUNNER_TEMP/editor-switch-test.js"
          emcc tests/feedback_graphic_pick.c -Isrc -sUSE_SDL=2 -sENVIRONMENT=node -O2 -sSAFE_HEAP=1 -o "$RUNNER_TEMP/editor-graphic-pick-test.js"
          node "$RUNNER_TEMP/editor-graphic-pick-test.js"
          emcc tests/feedback_animation_rooms.c src/sb_decompress.c src/logging.c -Isrc -sUSE_SDL=2 -sENVIRONMENT=node -O2 --embed-file amiga/data/levels -o "$RUNNER_TEMP/editor-animation-rooms.js"
          node "$RUNNER_TEMP/editor-animation-rooms.js"
          emcc tests/feedback_draw_rooms.c src/level.c src/level_setup.c src/logging.c -Isrc -sUSE_SDL=2 -sENVIRONMENT=node -O2 -o "$RUNNER_TEMP/editor-draw-rooms.js"
          node "$RUNNER_TEMP/editor-draw-rooms.js"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-engine
          path: editor/public/runtime/
          if-no-files-found: error
  editor:
    name: Editor / ${{ matrix.os }}
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Download game engine preview
        uses: actions/download-artifact@v4
        with:
          name: editor-engine
          path: editor/public/runtime/
      - name: Validate binary contracts and editor commands
        run: npm test
      - name: Build static editor
        run: npm run build
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox
      - name: Check graphics startup and recovery
        run: npx playwright test tests/e2e/engine-startup.spec.ts
      - name: Exercise editor in real browsers
        run: npm run test:e2e
      - name: Upload static editor
        uses: actions/upload-artifact@v4
        with:
          name: level-editor-${{ matrix.os }}
          path: editor/dist/
          if-no-files-found: error
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: level-editor-failures-${{ matrix.os }}
          path: editor/test-results/
          if-no-files-found: ignore
